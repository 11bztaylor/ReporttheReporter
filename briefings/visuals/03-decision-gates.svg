<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1160 915" width="1160" height="915"><title>Report the Reporter visual briefing</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#5b9ceb"/></marker></defs><rect width="100%" height="100%" fill="#0b1728"/><text x="50" y="64" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><tspan x="50" dy="0">Should this signal reach leadership?</tspan></text><text x="50" y="102" fill="#c4d7ee" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500"><tspan x="50" dy="0">Program review prevents transient or poor-quality data from becoming executive panic.</tspan></text><rect x="53" y="145" width="1051" height="91" rx="18" fill="#14263c" stroke="#385372" stroke-width="2"/><circle cx="104" cy="191" r="28" fill="#204a70"/><text x="97" y="199" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="97" dy="0">1</tspan></text><text x="160" y="183" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650"><tspan x="160" dy="0">Is the evidence valid, current and attributable?</tspan></text><text x="160" y="213" fill="#b9d3eb" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="160" dy="0">No → data-quality correction, do not rate Reporting Unit</tspan></text><path d="M580 239 L580 257" stroke="#5b9ceb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="53" y="261" width="1051" height="91" rx="18" fill="#14263c" stroke="#385372" stroke-width="2"/><circle cx="104" cy="307" r="28" fill="#204a70"/><text x="97" y="315" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="97" dy="0">2</tspan></text><text x="160" y="299" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650"><tspan x="160" dy="0">Is applicable monitoring / scan coverage adequate?</tspan></text><text x="160" y="329" fill="#b9d3eb" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="160" dy="0">No → visibility gap with owner and verification plan</tspan></text><path d="M580 355 L580 373" stroke="#5b9ceb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="53" y="377" width="1051" height="91" rx="18" fill="#14263c" stroke="#385372" stroke-width="2"/><circle cx="104" cy="423" r="28" fill="#624027"/><text x="97" y="431" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="97" dy="0">3</tspan></text><text x="160" y="415" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650"><tspan x="160" dy="0">Does it indicate an urgent material threat?</tspan></text><text x="160" y="445" fill="#f6c58a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="160" dy="0">Yes → immediate incident response, not a dashboard queue</tspan></text><path d="M580 471 L580 489" stroke="#5b9ceb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="53" y="493" width="1051" height="91" rx="18" fill="#14263c" stroke="#385372" stroke-width="2"/><circle cx="104" cy="539" r="28" fill="#204a70"/><text x="97" y="547" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="97" dy="0">4</tspan></text><text x="160" y="531" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650"><tspan x="160" dy="0">Is the deviation persistent and mission-relevant?</tspan></text><text x="160" y="561" fill="#b9d3eb" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="160" dy="0">No → normal operational monitoring</tspan></text><path d="M580 587 L580 605" stroke="#5b9ceb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="53" y="609" width="1051" height="91" rx="18" fill="#14263c" stroke="#385372" stroke-width="2"/><circle cx="104" cy="655" r="28" fill="#204a70"/><text x="97" y="663" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="97" dy="0">5</tspan></text><text x="160" y="647" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650"><tspan x="160" dy="0">Who has authority to fix the confirmed cause?</tspan></text><text x="160" y="677" fill="#b9d3eb" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="160" dy="0">Reporting Unit action / enterprise decision / risk review</tspan></text><path d="M580 703 L580 721" stroke="#5b9ceb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="53" y="725" width="1051" height="91" rx="18" fill="#14263c" stroke="#385372" stroke-width="2"/><circle cx="104" cy="771" r="28" fill="#204a70"/><text x="97" y="779" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="97" dy="0">6</tspan></text><text x="160" y="763" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650"><tspan x="160" dy="0">Did the approved action work?</tspan></text><text x="160" y="793" fill="#b9d3eb" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="160" dy="0">Re-measure and retain the decision and historical context</tspan></text><text x="52" y="885" fill="#96b2cd" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500"><tspan x="52" dy="0">REPORT THE REPORTER  /  PROPOSED PROGRAM  •  illustrative operating model</tspan></text></svg>