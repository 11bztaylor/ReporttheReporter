<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1160 955" width="1160" height="955"><title>Report the Reporter visual briefing</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#5b9ceb"/></marker></defs><rect width="100%" height="100%" fill="#0b1728"/><text x="45" y="62" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700"><tspan x="45" dy="0">One finding. Four different conversations.</tspan></text><text x="45" y="100" fill="#c6d7ee" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="45" dy="0">Hypothetical vulnerability example  •  not a real agency assessment</tspan></text><rect x="45" y="140" width="522" height="304" rx="18" fill="#13253c" stroke="#34506f" stroke-width="2"/><rect x="45" y="140" width="522" height="10" rx="5" fill="#63acff"/><text x="69" y="193" fill="#d8e7fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700"><tspan x="69" dy="0">TECHNICAL</tspan></text><text x="69" y="265" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="700"><tspan x="69" dy="0">88%</tspan></text><text x="69" y="300" fill="#a6bdd6" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="69" dy="0">eligible scan coverage</tspan></text><text x="69" y="349" fill="#e2edfc" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="69" dy="0">37 overdue H/C findings; 12 on priority systems</tspan></text><text x="69" y="400" fill="#63acff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600"><tspan x="69" dy="0">What do scans actually establish?</tspan></text><rect x="593" y="140" width="522" height="304" rx="18" fill="#13253c" stroke="#34506f" stroke-width="2"/><rect x="593" y="140" width="522" height="10" rx="5" fill="#ae9bff"/><text x="617" y="193" fill="#d8e7fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700"><tspan x="617" dy="0">PROGRAM</tspan></text><text x="617" y="265" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="700"><tspan x="617" dy="0">LIMITED</tspan></text><text x="617" y="300" fill="#a6bdd6" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="617" dy="0">measurement confidence</tspan></text><text x="617" y="349" fill="#e2edfc" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="617" dy="0">Coverage gaps + timing reviewed; trends validated</tspan></text><text x="617" y="400" fill="#ae9bff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600"><tspan x="617" dy="0">Is there persistent, decision-grade evidence?</tspan></text><rect x="45" y="470" width="522" height="304" rx="18" fill="#13253c" stroke="#34506f" stroke-width="2"/><rect x="45" y="470" width="522" height="10" rx="5" fill="#f1bb68"/><text x="69" y="523" fill="#d8e7fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700"><tspan x="69" dy="0">AGENCY</tspan></text><text x="69" y="595" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="700"><tspan x="69" dy="0">WHY?</tspan></text><text x="69" y="630" fill="#a6bdd6" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="69" dy="0">service / mission impact</tspan></text><text x="69" y="679" fill="#e2edfc" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="69" dy="0">Staffing, vendor, change windows or ownership?</tspan></text><text x="69" y="730" fill="#f1bb68" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600"><tspan x="69" dy="0">What can our agency fix?</tspan></text><rect x="593" y="470" width="522" height="304" rx="18" fill="#13253c" stroke="#34506f" stroke-width="2"/><rect x="593" y="470" width="522" height="10" rx="5" fill="#6cd9b6"/><text x="617" y="523" fill="#d8e7fa" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700"><tspan x="617" dy="0">EXECUTIVE</tspan></text><text x="617" y="595" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="700"><tspan x="617" dy="0">ACT?</tspan></text><text x="617" y="630" fill="#a6bdd6" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="617" dy="0">shared response</tspan></text><text x="617" y="679" fill="#e2edfc" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="617" dy="0">Common enterprise obstacle verified first</tspan></text><text x="617" y="730" fill="#6cd9b6" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600"><tspan x="617" dy="0">Does this require cross-agency funding or policy?</tspan></text><rect x="45" y="825" width="1070" height="68" rx="18" fill="#15362c" stroke="#3d927b" stroke-width="2"/><text x="73" y="867" fill="#cef7e8" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600"><tspan x="73" dy="0">Every layer can trace the claim back to the same source evidence, snapshots and limitations.</tspan></text><text x="52" y="925" fill="#96b2cd" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500"><tspan x="52" dy="0">REPORT THE REPORTER  /  PROPOSED PROGRAM  •  illustrative operating model</tspan></text></svg>