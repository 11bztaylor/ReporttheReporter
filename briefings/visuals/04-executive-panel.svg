<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1170 935" width="1170" height="935"><title>Report the Reporter visual briefing</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#5b9ceb"/></marker></defs><rect width="100%" height="100%" fill="#0b1728"/><text x="55" y="67" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700"><tspan x="55" dy="0">What leaders should see</tspan></text><text x="55" y="109" fill="#c4d4e7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500"><tspan x="55" dy="0">Example executive assurance panel  •  fictional numbers, no universal security grade</tspan></text><rect x="55" y="147" width="342" height="177" rx="18" fill="#14253b" stroke="#2d4865" stroke-width="2"/><text x="79" y="192" fill="#b7cde3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700"><tspan x="79" dy="0">ASSESSED</tspan></text><text x="79" y="255" fill="#d8e8ff" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700"><tspan x="79" dy="0">88%</tspan></text><text x="79" y="293" fill="#bfd0e6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500"><tspan x="79" dy="0">Asset scope  •  12% not verified</tspan></text><rect x="415" y="147" width="342" height="177" rx="18" fill="#14253b" stroke="#2d4865" stroke-width="2"/><text x="439" y="192" fill="#b7cde3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700"><tspan x="439" dy="0">OVERDUE</tspan></text><text x="439" y="255" fill="#f5c17b" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700"><tspan x="439" dy="0">37</tspan></text><text x="439" y="293" fill="#bfd0e6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500"><tspan x="439" dy="0">High/critical findings in assessed scope</tspan></text><rect x="775" y="147" width="342" height="177" rx="18" fill="#14253b" stroke="#2d4865" stroke-width="2"/><text x="799" y="192" fill="#b7cde3" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700"><tspan x="799" dy="0">CONFIDENCE</tspan></text><text x="799" y="255" fill="#d8c6ff" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700"><tspan x="799" dy="0">LIMITED</tspan></text><text x="799" y="293" fill="#bfd0e6" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="500"><tspan x="799" dy="0">Freshness and coverage need review</tspan></text><rect x="55" y="357" width="1062" height="180" rx="18" fill="#15263b" stroke="#3c5a78" stroke-width="2"/><rect x="79" y="381" rx="13" width="135.2" height="30" fill="#54b7f7" opacity=".2"/><text x="93" y="402" fill="#eaf2fd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700"><tspan x="93" dy="0">OBSERVATION</tspan></text><text x="79" y="444" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600"><tspan x="79" dy="0">Overdue findings persist in priority systems.</tspan><tspan x="79" dy="32.199999999999996">The unverified population remains explicitly unknown.</tspan></text><rect x="55" y="559" width="1062" height="160" rx="18" fill="#24301f" stroke="#687d42" stroke-width="2"/><rect x="79" y="581" rx="13" width="172" height="30" fill="#d7ab57" opacity=".2"/><text x="93" y="602" fill="#eaf2fd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700"><tspan x="93" dy="0">DECISION NEEDED</tspan></text><text x="79" y="635" fill="#f6f5e5" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600"><tspan x="79" dy="0">Confirm Reporting Unit operational cause before proposing shared investment.</tspan></text><text x="79" y="680" fill="#e0e4cd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500"><tspan x="79" dy="0">Owner: Reporting Unit + risk partners   •   Review: next monthly cycle</tspan></text><rect x="55" y="740" width="1062" height="135" rx="18" fill="#143d36" stroke="#3e967c" stroke-width="2"/><rect x="79" y="762" rx="13" width="190.39999999999998" height="30" fill="#60c6a8" opacity=".2"/><text x="93" y="783" fill="#eaf2fd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700"><tspan x="93" dy="0">PROVE IMPROVEMENT</tspan></text><text x="79" y="815" fill="#eafff8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600"><tspan x="79" dy="0">Recheck remediation aging and coverage after action.</tspan></text><text x="52" y="905" fill="#96b2cd" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500"><tspan x="52" dy="0">REPORT THE REPORTER  /  PROPOSED PROGRAM  •  illustrative operating model</tspan></text></svg>