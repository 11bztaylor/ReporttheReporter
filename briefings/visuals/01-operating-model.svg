<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1160 925" width="1160" height="925"><title>Report the Reporter visual briefing</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#5b9ceb"/></marker></defs><rect width="100%" height="100%" fill="#0b1728"/><text x="52" y="65" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700"><tspan x="52" dy="0">From telemetry to trusted decisions</tspan></text><text x="52" y="105" fill="#b4c7de" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500"><tspan x="52" dy="0">One source of evidence; four decision-appropriate views.</tspan></text><rect x="52" y="147" width="1056" height="116" rx="18" fill="#14263d" stroke="#34516e" stroke-width="2"/><rect x="52" y="147" width="10" height="116" rx="5" fill="#56a9f2"/><text x="87" y="185" fill="#f8fbff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="87" dy="0">01 · TECHNICAL EVIDENCE</tspan></text><text x="550" y="185" fill="#cbdced" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500"><tspan x="550" dy="0">security monitoring · endpoint protection platform · vulnerability data</tspan><tspan x="550" dy="25.2">Asset inventory, source time, scan status</tspan></text><path d="M580 266 L580 291" stroke="#5b9ceb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="52" y="298" width="1056" height="116" rx="18" fill="#14263d" stroke="#34516e" stroke-width="2"/><rect x="52" y="298" width="10" height="116" rx="5" fill="#b69aff"/><text x="87" y="336" fill="#f8fbff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="87" dy="0">02 · MEASUREMENT PROGRAM</tspan></text><text x="550" y="336" fill="#cbdced" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500"><tspan x="550" dy="0">Coverage and confidence · historical trends</tspan><tspan x="550" dy="25.2">Validated finding, unresolved unknowns</tspan></text><path d="M580 417 L580 442" stroke="#5b9ceb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="52" y="449" width="1056" height="116" rx="18" fill="#14263d" stroke="#34516e" stroke-width="2"/><rect x="52" y="449" width="10" height="116" rx="5" fill="#ebbd75"/><text x="87" y="487" fill="#f8fbff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="87" dy="0">03 · AGENCY DECISION</tspan></text><text x="550" y="487" fill="#cbdced" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500"><tspan x="550" dy="0">Service/mission impact · root causes</tspan><tspan x="550" dy="25.2">Local action or documented escalation</tspan></text><path d="M580 568 L580 593" stroke="#5b9ceb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="52" y="600" width="1056" height="116" rx="18" fill="#14263d" stroke="#34516e" stroke-width="2"/><rect x="52" y="600" width="10" height="116" rx="5" fill="#69d0b0"/><text x="87" y="638" fill="#f8fbff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700"><tspan x="87" dy="0">04 · ENTERPRISE DECISION</tspan></text><text x="550" y="638" fill="#cbdced" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500"><tspan x="550" dy="0">Cross-Reporting Unit issues · funding/policy</tspan><tspan x="550" dy="25.2">Owner, rationale and outcome review</tspan></text><rect x="52" y="771" width="1056" height="82" rx="18" fill="#14382e" stroke="#36826f" stroke-width="2"/><text x="83" y="805" fill="#a6f1d9" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700"><tspan x="83" dy="0">FEEDBACK LOOP</tspan></text><text x="350" y="805" fill="#eafaf5" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500"><tspan x="350" dy="0">Did the decision reduce exposure or improve coverage?</tspan></text><text x="52" y="895" fill="#96b2cd" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="500"><tspan x="52" dy="0">REPORT THE REPORTER  /  PROPOSED PROGRAM  •  illustrative operating model</tspan></text></svg>